@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f8f6;--paper:#fff;--ink:#182437;--muted:#6d7789;--accent:#167553;--pale:#eaf5ef;--border:#dfe8e2;--green:#167553;--red:#b3324a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'DM Sans',Arial,sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:var(--accent)}h1,h2,h3{font-family:Manrope,Arial,sans-serif;letter-spacing:-.035em}h1{font-size:clamp(28px,3.5vw,44px);line-height:1.15;margin:12px 0 16px}h2{font-size:24px;margin:8px 0 14px}h3{font-size:17px;margin:0 0 12px}p{line-height:1.65}header{height:76px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-family:Manrope;font-size:19px}.brand-text{display:flex;flex-direction:column;gap:3px;line-height:1.15}.brand-text small{font-family:"DM Sans",Arial,sans-serif;font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted)}.logo{width:37px;height:37px;background:var(--accent);color:white;border-radius:11px;display:grid;place-items:center;font-size:23px}.top-meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.app{max-width:1530px;margin:auto;display:grid;grid-template-columns:228px minmax(0,1fr)}aside{padding:32px 20px;background:#fff;min-height:calc(100vh - 76px);border-right:1px solid var(--border)}.side-label{font-size:10px;letter-spacing:.14em;font-weight:700;color:#939aab;padding:0 13px;margin:0 0 14px}nav{display:grid;gap:6px}.navbtn{border:0;background:none;text-align:left;padding:12px 14px;border-radius:9px;color:#657083;font-weight:600;display:flex;gap:12px;align-items:center}.navbtn.active{background:var(--pale);color:var(--accent)}.navbtn:hover{background:#f0f7f3}.navicon{font-size:17px;width:20px;text-align:center}.mentor{margin:32px 6px 0;padding:18px 14px;border:1px solid var(--border);border-radius:12px;background:#f8fbf9}.mentor p{font-size:12px;color:var(--muted);margin:8px 0}.mentor strong{font-size:12px}main{padding:34px clamp(20px,3.2vw,46px) 60px;min-width:0}.eyebrow{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}.pagehead{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.pagehead p{margin:0;color:var(--muted)}.badge{display:inline-block;font-size:11px;font-weight:700;background:var(--pale);color:var(--accent);padding:7px 10px;border-radius:6px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:white;padding:12px 18px;border-radius:8px;border:1px solid var(--accent);font-weight:700;text-decoration:none;font-size:13px}.btn.light{background:white;color:var(--ink);border-color:var(--border)}.btn.soft{background:var(--pale);border-color:transparent;color:var(--accent)}.btn.danger{background:#fff0f1;color:var(--red);border-color:#efd0d6}.btn.small{padding:8px 12px;font-size:12px}.hero{display:grid;grid-template-columns:1.5fr 1fr;border:1px solid #d6eadd;background:linear-gradient(120deg,#ecf6ef,#fff);border-radius:16px;margin-bottom:22px;overflow:hidden}.hero-content{padding:32px}.hero h1{max-width:470px}.hero p{max-width:475px;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero-art{position:relative;display:grid;place-items:center;min-height:240px;background:radial-gradient(circle at 50% 50%,#dcefe3 0,transparent 69%)}.hero-art svg{width:100%;max-width:300px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0 28px}.stat{background:white;border:1px solid var(--border);border-radius:12px;padding:20px}.stat small{color:var(--muted);font-size:12px;display:block}.stat strong{font-family:Manrope;font-size:28px;display:block;margin:8px 0}.stat span{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--border);border-radius:13px;padding:24px;min-width:0}.card p{font-size:13px;color:var(--muted)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.cardhead h2,.cardhead h3{margin:0}.domainrow{padding:14px 0;border-top:1px solid var(--border)}.domainrow:first-of-type{border-top:0}.rowline{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:12px;margin-bottom:9px}.bar{height:5px;background:#e7eee9;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.muted{color:var(--muted)}.smalltext{font-size:12px;line-height:1.6}.pathstep{display:flex;gap:13px;padding:14px 0;border-top:1px solid var(--border)}.stepnum{width:27px;height:27px;border-radius:8px;background:var(--pale);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}.pathstep p{margin:4px 0 0}.bottomnote{font-size:11px;color:#8991a1;line-height:1.6;margin-top:24px}.lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lesson-grid .card{display:flex;flex-direction:column;align-items:flex-start}.lesson-grid .actions{margin-top:auto;padding-top:14px}.lesson-icon{width:42px;height:42px;display:grid;place-items:center;background:var(--pale);border-radius:11px;color:var(--accent);font-weight:800;font-size:19px;margin-bottom:18px}.field{display:grid;gap:7px;font-size:12px}input,select,textarea{padding:11px 12px;border:1px solid #cdd2de;border-radius:7px;background:white;max-width:100%;color:var(--ink)}textarea{width:100%;min-height:90px}input:focus,textarea:focus,select:focus{outline:2px solid #94c7ab;outline-offset:2px}.question-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}.question-top{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--border);font-size:12px}.stem{font-size:17px;line-height:1.8;margin:24px 0 20px;color:#172236}.stem sup{font-size:.7em}.choices{display:grid;gap:11px}.choice{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid #dce0e9;border-radius:9px;padding:13px 15px;background:white;line-height:1.6;color:var(--ink);width:100%}.choice b{width:27px;height:27px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;font-size:12px;flex-shrink:0}.choice.selected{background:var(--pale);border-color:var(--accent)}.choice.selected b{background:var(--accent);color:white;border-color:var(--accent)}.choice.correct{background:#edf8f2;border-color:#85c7ac}.choice.incorrect{background:#fff0f2;border-color:#df9fac}.answer-input{max-width:260px;font-size:19px;width:100%}.feedback{padding:18px;border-radius:9px;background:#eff7f2;margin:20px 0;line-height:1.75;font-size:14px}.feedback.good{background:#edf8f2;border-left:3px solid var(--green)}.feedback.bad{background:#fff0f2;border-left:3px solid var(--red)}.feedback p{color:inherit;font-size:14px}.hint{background:#fffae9;border:1px solid #eee0ae;padding:14px;border-radius:8px;margin:16px 0;font-size:13px;line-height:1.65}.qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.qnav button{height:35px;border-radius:6px;border:1px solid var(--border);background:white;color:var(--ink);font-size:12px}.qnav button.current{outline:2px solid var(--accent)}.qnav button.answered{background:var(--pale);color:var(--accent)}.qnav button.flagged:after{content:'•';color:#a56415;padding-left:3px}.timer{font-size:25px;font-weight:800;font-family:Manrope;font-variant-numeric:tabular-nums}.timer.urgent{color:var(--red)}.formula{padding:17px;background:#f3f8f5;border:1px solid var(--border);border-radius:8px;line-height:1.9;margin:16px 0}.lesson-copy{max-width:780px}.lesson-copy li{line-height:1.8;margin:12px 0}.lesson-copy p{font-size:15px;color:var(--ink)}table{width:100%;border-collapse:collapse;font-size:12px;margin:16px 0}th,td{text-align:left;border:1px solid var(--border);padding:11px}th{background:#f3f8f5}.tablewrap{overflow:auto}.qfigure{max-width:100%;margin:16px 0}.qfigure table{text-align:center;max-width:420px}.qfigure td,.qfigure th{text-align:center}pre{white-space:pre-wrap;background:#182437;color:#f6f6ff;padding:17px;border-radius:8px;line-height:1.8;font:13px Consolas,monospace;overflow-wrap:anywhere}.desmos-steps li{padding:7px 0;line-height:1.8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.empty{padding:40px 15px;text-align:center;color:var(--muted)}.noticeline{padding:12px 15px;background:var(--pale);border-radius:7px;margin-bottom:16px;font-size:12px;line-height:1.7}.review-item{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--border)}.review-item:last-child{border-bottom:0}.review-item strong{font-size:13px}.review-item p{margin:5px 0}.report{display:none}button:focus-visible,a:focus-visible{outline:3px solid #94c7ab;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}.print-btn{white-space:nowrap}.status{font-size:12px;color:var(--muted);min-height:20px}.check-row{display:flex;align-items:center;gap:8px;font-size:12px}.progress-list .card{margin-bottom:15px}
.question-preview .stem{font-size:14px;margin:7px 0 14px}.question-preview .qfigure{width:100%}.question-preview .qfigure svg{width:100%;max-width:320px}

</style></head><body><header><div class="brand"><div class="logo">m</div><div class="brand-text"><span>Math Coach</span><small>Student: Blessing</small></div><span class="badge">SAT PREP</span></div><div class="top-meta"><span>Learn with purpose. Practise with confidence.</span><strong>Dr. Atandoh</strong></div></header><div class="app"><aside><div class="side-label">YOUR WORKSPACE</div><nav id="nav"></nav><div class="mentor"><strong>A little better, every session.</strong><p>Understand the method. Review the mistake. Try again without help.</p><p>Progress saves on this device.</p></div></aside><main id="main"></main></div><section class="report" id="report"></section><script>const BANK=[{"n": 1, "domain": "Algebra", "q": "If 5x − 7 = 18, what is the value of x?", "choices": ["2.2", "5", "11", "25"], "answer": "B", "solution": "Add 7 to both sides to obtain 5x = 25. Divide by 5: x = 5.", "figure": null, "hint": "Isolate the term containing x before dividing.", "testSet": 1}, {"n": 2, "domain": "Problem-Solving and Data Analysis", "q": "A store sells 18 identical notebooks for a total of $45. At the same price per notebook, what is the total cost of 8 notebooks?", "choices": ["$16", "$18", "$20", "$24"], "answer": "C", "solution": "Each notebook costs 45/18 = $2.50. Therefore, 8 notebooks cost 8(2.50) = $20.", "figure": null, "hint": "Find the price of one notebook first.", "testSet": 1}, {"n": 3, "domain": "Advanced Math", "q": "Which expression is equivalent to (x + 4)(x − 3)?", "choices": ["x² − 12", "x² − x − 12", "x² + 7x − 12", "x² + x − 12"], "answer": "D", "solution": "Multiply and combine like terms: x² − 3x + 4x − 12 = x² + x − 12.", "figure": null, "hint": "Multiply each term in the first bracket by each term in the second.", "testSet": 1}, {"n": 4, "domain": "Algebra", "q": "The table shows three values of a linear function f. Which equation defines f?", "choices": ["f(x) = −2x + 7", "f(x) = 2x + 7", "f(x) = −4x + 5", "f(x) = −2x + 5"], "answer": "A", "solution": "The slope is (5 − 9)/(1 − (−1)) = −2. Substitute (1, 5): 5 = −2(1) + b, so b = 7.", "figure": "linear_table", "hint": "Compute the slope using two rows, then find the intercept.", "testSet": 1}, {"n": 5, "domain": "Geometry and Trigonometry", "q": "Two angles of a triangle have measures of 38° and 67°. What is the measure of the third angle?", "choices": ["29°", "67°", "75°", "105°"], "answer": "C", "solution": "The angles of a triangle sum to 180°. The third angle is 180 − 38 − 67 = 75°.", "figure": null, "hint": "Triangle angles add to 180°.", "testSet": 1}, {"n": 6, "domain": "Algebra", "q": "A recreation center charges a one-time registration fee of $12 and $4 for each class. Maya paid a total of $44. How many classes did she purchase?", "choices": null, "answer": "8", "solution": "Let c be the number of classes. Solve 12 + 4c = 44 to obtain c = 8.", "figure": null, "hint": "Separate the fixed fee from the class charges.", "testSet": 1}, {"n": 7, "domain": "Advanced Math", "q": "The function f is defined by f(x) = 2x² − 3. What is the value of f(−2)?", "choices": ["−11", "−5", "1", "5"], "answer": "D", "solution": "Substitute −2: f(−2) = 2(−2)² − 3 = 8 − 3 = 5.", "figure": null, "hint": "Substitute −2 with parentheses before squaring.", "testSet": 1}, {"n": 8, "domain": "Problem-Solving and Data Analysis", "q": "A data set consists of the values 6, 8, 10, 12, and 14. If the value 14 is removed, what is the mean of the remaining data set?", "choices": ["8", "9", "10", "11"], "answer": "B", "solution": "The remaining sum is 6 + 8 + 10 + 12 = 36. Divide by 4 to obtain a mean of 9.", "figure": null, "hint": "Recalculate both the sum and count after removing 14.", "testSet": 1}, {"n": 9, "domain": "Algebra", "q": "An employee earns a fixed weekly payment of $180 plus $15 for each hour worked. Which inequality represents the number of hours h the employee must work to earn at least $360 in a week?", "choices": ["h ≤ 12", "h ≥ 24", "h ≥ 12", "h ≤ 24"], "answer": "C", "solution": "The earnings must satisfy 180 + 15h ≥ 360. Subtract 180 and divide by 15 to get h ≥ 12.", "figure": null, "hint": "Translate “at least” into an inequality.", "testSet": 1}, {"n": 10, "domain": "Advanced Math", "q": "The function P(t) = 420(1.06)<sup>t</sup> models the number of plants in a greenhouse t years after a survey. Which statement best describes the model?", "choices": ["The number of plants increases by 6% each year.", "The number of plants increases by 6 each year.", "The initial number of plants is 1.06.", "The number of plants increases by 106% each year."], "answer": "A", "solution": "The growth factor 1.06 equals 1 + 0.06, representing a 6% increase each year. The initial value is 420.", "figure": null, "hint": "For exponential growth, compare the base with 1.", "testSet": 1}, {"n": 11, "domain": "Geometry and Trigonometry", "q": "A circle in the xy-plane has equation (x − 3)² + (y + 2)² = 49. What is the radius of the circle?", "choices": null, "answer": "7", "solution": "In (x − h)² + (y − k)² = r², the right side is the squared radius. Thus r = √49 = 7.", "figure": null, "hint": "Compare the equation with (x − h)² + (y − k)² = r².", "testSet": 1}, {"n": 12, "domain": "Algebra", "q": "The solution to the system below is (x, y). What is the value of x + y?<br/><br/>2x + 3y = 19<br/>x − y = 2", "choices": ["3", "5", "7", "8"], "answer": "D", "solution": "From x − y = 2, x = y + 2. Substitute: 2(y + 2) + 3y = 19, so y = 3 and x = 5. Then x + y = 8.", "figure": null, "hint": "Use the second equation to express x in terms of y.", "testSet": 1}, {"n": 13, "domain": "Advanced Math", "q": "What is the smaller solution to the equation x² − 9x + 20 = 0?", "choices": null, "answer": "4", "solution": "Factor: (x − 4)(x − 5) = 0. The solutions are 4 and 5, so the smaller solution is 4.", "figure": null, "hint": "Look for two numbers whose product is 20 and sum is −9.", "testSet": 1}, {"n": 14, "domain": "Geometry and Trigonometry", "q": "In the right triangle shown, what is the value of sin A?", "choices": ["3/5", "4/5", "3/4", "5/3"], "answer": "A", "solution": "The side opposite angle A has length 9, and the hypotenuse has length 15. Therefore sin A = 9/15 = 3/5.", "figure": "triangle", "hint": "Sine is opposite divided by hypotenuse.", "testSet": 1}, {"n": 15, "domain": "Problem-Solving and Data Analysis", "q": "The table shows whether students participated in a service project. If one of the seniors is selected at random, what is the probability that the student participated?", "choices": ["7/20", "7/10", "14/25", "5/8"], "answer": "C", "solution": "There are 28 + 22 = 50 seniors. Of these, 28 participated. The conditional probability is 28/50 = 14/25.", "figure": "survey", "hint": "Restrict your denominator to seniors only.", "testSet": 1}, {"n": 16, "domain": "Algebra", "q": "For what value of k does the system below have no solution?<br/><br/>kx + 4y = 12<br/>y = 3x − 5", "choices": null, "answer": "−12", "solution": "Rewrite the first equation as y = (−k/4)x + 3. Parallel, distinct lines have the same slope, so −k/4 = 3 and k = −12. The intercepts 3 and −5 differ.", "figure": null, "hint": "No solution means parallel, distinct lines.", "testSet": 1}, {"n": 17, "domain": "Advanced Math", "q": "For x ≠ 5, which expression is equivalent to (x² − 25)/(x − 5)?", "choices": ["x − 5", "x + 5", "x² + 5", "x² − 5"], "answer": "B", "solution": "Factor the numerator as (x − 5)(x + 5), then cancel x − 5. The result is x + 5, with x ≠ 5.", "figure": null, "hint": "Factor the difference of two squares first.", "testSet": 1}, {"n": 18, "domain": "Algebra", "q": "A tank initially contains 240 liters of water. Water drains at a constant rate. After 6 minutes, 168 liters remain. If the water continues to drain at the same rate, how many liters remain after 15 minutes?", "choices": ["12", "48", "60", "72"], "answer": "C", "solution": "The tank loses (240 − 168)/6 = 12 liters per minute. After 15 minutes, 240 − 12(15) = 60 liters remain.", "figure": null, "hint": "Find the amount drained per minute, then build a linear model.", "testSet": 1}, {"n": 19, "domain": "Advanced Math", "q": "The equation x² − 14x + k = 0 has exactly one real solution. What is the value of k?", "choices": null, "answer": "49", "solution": "Exactly one real solution requires a zero discriminant: (−14)² − 4k = 0. Therefore k = 196/4 = 49.", "figure": null, "hint": "Exactly one real root means the discriminant is zero.", "testSet": 1}, {"n": 20, "domain": "Advanced Math", "q": "A quadratic function f has zeros at −2 and 6, and f(0) = −24. What is the minimum value of f(x)?", "choices": ["−32", "−24", "−16", "2"], "answer": "A", "solution": "Write f(x) = a(x + 2)(x − 6). Since f(0) = −12a = −24, a = 2. The vertex is halfway between the zeros at x = 2. Then f(2) = 2(4)(−4) = −32.", "figure": null, "hint": "Use the zeros to write a factored expression and locate the vertex.", "testSet": 1}, {"n": 21, "domain": "Algebra", "q": "If 3(2x − 1) = 4x + 11, what is the value of x?", "choices": ["4", "5", "7", "14"], "answer": "C", "solution": "Expand: 6x − 3 = 4x + 11. Therefore 2x = 14 and x = 7.", "figure": null, "hint": "Expand the parentheses, then collect the x terms.", "testSet": 1}, {"n": 22, "domain": "Advanced Math", "q": "For x &gt; 0, which expression is equivalent to x<sup>3/2</sup>?", "choices": ["x√x", "√(3x)", "x³/2", "x²√x"], "answer": "A", "solution": "Use x<sup>3/2</sup> = x<sup>1 + 1/2</sup> = x · x<sup>1/2</sup> = x√x.", "figure": null, "hint": "Split 3/2 into 1 + 1/2.", "testSet": 1}, {"n": 23, "domain": "Geometry and Trigonometry", "q": "A right circular cylinder has radius 3 centimeters and height 10 centimeters. What is its volume, in cubic centimeters?", "choices": ["30π", "60π", "90π", "300π"], "answer": "C", "solution": "The volume is V = πr²h = π(3²)(10) = 90π cubic centimeters.", "figure": null, "hint": "Use the cylinder volume formula and square the radius.", "testSet": 1}, {"n": 24, "domain": "Problem-Solving and Data Analysis", "q": "A jacket originally priced at $80 is discounted by 25%. A sales tax of 8% is then applied to the discounted price. What is the final price, in dollars?", "choices": null, "answer": "64.8", "solution": "The discounted price is 80(0.75) = $60. After tax, the price is 60(1.08) = $64.80. Accept 64.8 or 64.80.", "figure": null, "hint": "Apply the discount first and the tax second.", "testSet": 1}, {"n": 25, "domain": "Algebra", "q": "A line in the xy-plane passes through (2, 7) and (6, 19). What is the y-coordinate of the y-intercept of the line?", "choices": ["−1", "1", "3", "5"], "answer": "B", "solution": "The slope is (19 − 7)/(6 − 2) = 3. Using 7 = 3(2) + b gives b = 1. The y-intercept has y-coordinate 1.", "figure": null, "hint": "Find the slope, then substitute a point into y = mx + b.", "testSet": 1}, {"n": 26, "domain": "Advanced Math", "q": "The function g is defined by g(x) = (x − 5)² − 9. What is the minimum value of g(x)?", "choices": ["−9", "−5", "5", "9"], "answer": "A", "solution": "Since (x − 5)² ≥ 0, its smallest value is 0 at x = 5. Therefore the minimum value of g is −9.", "figure": null, "hint": "A square cannot be negative.", "testSet": 1}, {"n": 27, "domain": "Algebra", "q": "Admission to a school play costs $12 for an adult and $8 for a student. A group purchased 31 tickets for a total of $308. How many adult tickets did the group purchase?", "choices": ["11", "15", "16", "20"], "answer": "B", "solution": "Let a be adult tickets and s be student tickets. Then a + s = 31 and 12a + 8s = 308. Subtract 8(a + s) = 248 from the revenue equation to obtain 4a = 60, so a = 15.", "figure": null, "hint": "Write one equation for ticket count and one for revenue.", "testSet": 1}, {"n": 28, "domain": "Geometry and Trigonometry", "q": "Two right triangles are similar. The smaller triangle has side lengths 6, 8, and 10. The hypotenuse of the larger triangle has length 25. What is the area of the larger triangle?", "choices": null, "answer": "150", "solution": "The linear scale factor is 25/10 = 2.5. The small triangle has area (1/2)(6)(8) = 24. Area scales by 2.5², so the large area is 24(6.25) = 150.", "figure": null, "hint": "Area scales by the square of the side-length scale factor.", "testSet": 1}, {"n": 29, "domain": "Advanced Math", "q": "The function N(t) = 300 · 2<sup>t/4</sup> models the number of bacteria in a culture t hours after an observation. According to the model, how many bacteria are in the culture after 12 hours?", "choices": ["900", "1,200", "1,800", "2,400"], "answer": "D", "solution": "N(12) = 300 · 2<sup>12/4</sup> = 300 · 2³ = 2,400.", "figure": null, "hint": "The exponent counts the number of four-hour doubling periods.", "testSet": 1}, {"n": 30, "domain": "Problem-Solving and Data Analysis", "q": "A random sample of 400 students at a school was surveyed about a proposal. Of those surveyed, 62% supported it. An estimated proportion was reported with a margin of error of 5 percentage points. Which statement is best supported?", "choices": ["Exactly 62% of all students support the proposal.", "At least 67% of all students support the proposal.", "A plausible range for the percentage of all students who support the proposal is 57% to 67%.", "The proposal is supported by 95% of all students."], "answer": "C", "solution": "Apply the margin of error to the estimate: 62% − 5% = 57% and 62% + 5% = 67%. This supports a plausible population range, not an exact percentage.", "figure": null, "hint": "A margin of error is added to and subtracted from the estimate.", "testSet": 1}, {"n": 31, "domain": "Algebra", "q": "Which inequality is equivalent to −3(2x − 5) &gt; 27?", "choices": ["x &gt; −2", "x &lt; −2", "x &gt; 7", "x &lt; 7"], "answer": "B", "solution": "Expand to obtain −6x + 15 &gt; 27, or −6x &gt; 12. Dividing by −6 reverses the inequality: x &lt; −2.", "figure": null, "hint": "Reverse the inequality when dividing by a negative number.", "testSet": 1}, {"n": 32, "domain": "Advanced Math", "q": "The graphs of y = x² and y = 2x + 3 intersect at two points. What is the sum of the y-coordinates of these points?", "choices": null, "answer": "10", "solution": "Set x² = 2x + 3. Then (x − 3)(x + 1) = 0, giving x = 3 and x = −1. The corresponding y-values are 9 and 1; their sum is 10.", "figure": null, "hint": "Find both x-coordinates first, then compute their y-coordinates.", "testSet": 1}, {"n": 33, "domain": "Algebra", "q": "For what value of a does the system below have infinitely many solutions?<br/><br/>ax + 6y = 18<br/>2x + 3y = 9", "choices": ["2", "3", "4", "6"], "answer": "C", "solution": "Multiplying the second equation by 2 gives 4x + 6y = 18. The first equation is identical precisely when a = 4.", "figure": null, "hint": "Infinitely many solutions require the two equations to describe the same line.", "testSet": 1}, {"n": 34, "domain": "Problem-Solving and Data Analysis", "q": "A data set has standard deviation s, where s &gt; 0. A new data set is formed by multiplying every value in the original data set by 3 and then adding 8. What is the standard deviation of the new data set?", "choices": ["s + 8", "3s", "3s + 8", "9s"], "answer": "B", "solution": "Multiplying all values by 3 multiplies their standard deviation by 3. Adding a constant changes the center but not the spread. The new standard deviation is 3s.", "figure": null, "hint": "Adding a constant does not change spread; multiplying scales it.", "testSet": 1}, {"n": 35, "domain": "Advanced Math", "q": "What is the solution to the equation √(3x + 10) = x?", "choices": ["−2", "2", "5", "−2 and 5"], "answer": "C", "solution": "Squaring gives 3x + 10 = x², so (x − 5)(x + 2) = 0. Check the candidates: x = 5 works, but x = −2 cannot equal a nonnegative square root.", "figure": null, "hint": "Square both sides, then check every candidate in the original equation.", "testSet": 1}, {"n": 36, "domain": "Geometry and Trigonometry", "q": "A circle in the xy-plane has equation x² + y² − 8x + 6y = 0. What is the radius of the circle?", "choices": ["5", "7", "10", "25"], "answer": "A", "solution": "Complete the square: (x − 4)² + (y + 3)² = 16 + 9 = 25. Thus the radius is 5.", "figure": null, "hint": "Complete the square separately for x and y.", "testSet": 1}, {"n": 37, "domain": "Algebra", "q": "For constants a and b, the equation a(3x − 2) = 12x + b is true for every real number x. What is the value of a + b?", "choices": null, "answer": "−4", "solution": "Equate the coefficients of x: 3a = 12, so a = 4. Equate constants: b = −2a = −8. Hence a + b = −4.", "figure": null, "hint": "An identity must match both its x coefficients and its constant terms.", "testSet": 1}, {"n": 38, "domain": "Advanced Math", "q": "The equation 3/(x − 2) + 2/(x + 2) = 1 has two real solutions. What is the sum of these solutions?", "choices": ["−5", "−1", "5", "6"], "answer": "C", "solution": "For x ≠ ±2, multiply by (x − 2)(x + 2): 3(x + 2) + 2(x − 2) = x² − 4. Thus x² − 5x − 6 = 0, with roots 6 and −1. Both are allowed, and the sum is 5.", "figure": null, "hint": "Multiply by the common denominator, but exclude x = ±2.", "testSet": 1}, {"n": 39, "domain": "Algebra", "q": "For what value of b does the system below have no solution?<br/><br/>4x + by = 12<br/>8x + 6y = 30", "choices": ["0", "2", "3", "6"], "answer": "C", "solution": "The second equation divided by 2 is 4x + 3y = 15. With b = 3, the first equation has the same left side but a different constant, so no point satisfies both.", "figure": null, "hint": "Compare the equations after making the x coefficients equal.", "testSet": 1}, {"n": 40, "domain": "Advanced Math", "q": "The equation x² + kx + 36 = 0 has two positive real solutions. One solution is four times the other. What is the value of k?", "choices": null, "answer": "−15", "solution": "Let the roots be r and 4r, with r &gt; 0. Their product is 4r² = 36, so r = 3. The roots are 3 and 12. Their sum is −k, so k = −15.", "figure": null, "hint": "The roots’ product is 36 and their sum is −k.", "testSet": 1}, {"n": 41, "domain": "Algebra", "q": "A linear function f satisfies f(2) = 9 and f(5) = 21. What is the value of f(t + 3) − f(t) for any real number t?", "choices": ["3", "4", "9", "12"], "answer": "D", "solution": "The slope is (21 − 9)/(5 − 2) = 4. Increasing the input by 3 increases the output by 4(3) = 12.", "figure": null, "hint": "A fixed input increase produces slope × input increase.", "testSet": 1}, {"n": 42, "domain": "Advanced Math", "q": "The graphs of y = x² − 6x + c and y = 2x + 1 intersect at exactly one point. What is the value of c?", "choices": null, "answer": "17", "solution": "Set the expressions equal: x² − 8x + c − 1 = 0. Exactly one intersection means the discriminant is zero: 64 − 4(c − 1) = 0, so c = 17.", "figure": null, "hint": "Substitute the line into the parabola and use a zero discriminant.", "testSet": 1}, {"n": 43, "domain": "Problem-Solving and Data Analysis", "q": "A random survey of 400 residents has a margin of error of 4 percentage points. For a similar survey at the same confidence level, how many residents should be sampled to reduce the margin of error to about 2 percentage points?", "choices": ["200", "800", "1,600", "3,200"], "answer": "C", "solution": "Margin of error varies approximately as 1/√n. Halving it requires multiplying n by 4. The required sample size is approximately 4(400) = 1,600.", "figure": null, "hint": "To halve a quantity proportional to 1/√n, multiply n by four.", "testSet": 1}, {"n": 44, "domain": "Geometry and Trigonometry", "q": "A chord of a circle has length 16. The perpendicular distance from the center of the circle to the chord is 6. What is the radius of the circle?", "choices": ["8", "10", "12", "20"], "answer": "B", "solution": "The perpendicular from the center bisects the chord, making a right triangle with legs 8 and 6. Its hypotenuse is the radius: √(8² + 6²) = 10.", "figure": null, "hint": "A perpendicular from the center bisects the chord.", "testSet": 1}, {"n": 45, "domain": "Algebra", "q": "If 6x − 10 = 32, what is the value of x?", "choices": ["8", "5", "7", "11"], "answer": "C", "solution": "Add 10 to both sides, then divide by 6: x = (32 + 10)/6 = 7.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 46, "domain": "Problem-Solving and Data Analysis", "q": "A shop sells 13 identical pens for $52. At the same price per pen, how much do 8 pens cost, in dollars?", "choices": ["33", "30", "36", "32"], "answer": "D", "solution": "The unit price is 52/13 = $4. The cost is 8(4) = $32.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 47, "domain": "Advanced Math", "q": "Which expression is equivalent to (x + 6)(x − 3)?", "choices": ["x² + 3x − 18", "x² − 3x − 18", "x² + 9x − 18", "x² + 3x + 18"], "answer": "A", "solution": "Expanding gives x² − 3x + 6x − 18 = x² + 3x − 18.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 48, "domain": "Algebra", "q": "A linear function f satisfies f(1) = 5 and f(3) = -3. Which equation defines f?", "choices": ["f(x) = 4x + 9", "f(x) = -4x + 9", "f(x) = -4x + 11", "f(x) = -5x + 9"], "answer": "B", "solution": "The slope is (-3 − 5)/(3 − 1) = -4. Substitute x = 1 to get intercept 9.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 49, "domain": "Geometry and Trigonometry", "q": "Two angles of a triangle measure 43° and 63°. What is the measure, in degrees, of the third angle?", "choices": ["75", "72", "74", "78"], "answer": "C", "solution": "Triangle angles sum to 180°, so the missing angle is 180 − 43 − 63 = 74°.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 50, "domain": "Algebra", "q": "A music club charges a registration fee of $16 and $6 per workshop. A student pays $64 in total. How many workshops did the student purchase?", "choices": null, "answer": "8", "solution": "Solve 16 + 6n = 64. Subtract 16 and divide by 6 to obtain n = 8.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 51, "domain": "Advanced Math", "q": "The function f is defined by f(x) = 4x² − 6. What is f(−3)?", "choices": ["30", "31", "28", "34"], "answer": "A", "solution": "f(−3) = 4(9) − 6 = 30.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 52, "domain": "Problem-Solving and Data Analysis", "q": "A data set is 9, 11, 13, 15, 17. If 17 is removed, what is the mean of the remaining values?", "choices": ["13", "12", "10", "16"], "answer": "B", "solution": "The remaining sum is 48. Divide by 4 to obtain 12.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 53, "domain": "Algebra", "q": "A worker earns $170 per week plus $13 per hour worked. Which inequality gives the hours h needed to earn at least $313?", "choices": ["h ≤ 11", "h ≥ 16", "h ≥ 11", "h ≤ 16"], "answer": "C", "solution": "170 + 13h ≥ 313. Thus 13h ≥ 143, or h ≥ 11.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 54, "domain": "Advanced Math", "q": "The function P(t) = 400(1.07)<sup>t</sup> models a population t years after an observation. Which statement describes the model?", "choices": ["The population increases by 7 each year.", "The initial population is 7.", "The population decreases by 7% each year.", "The population increases by 7% each year."], "answer": "D", "solution": "The multiplier 1.07 is 1 + 7/100, so the annual growth rate is 7%.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 55, "domain": "Geometry and Trigonometry", "q": "A circle has equation (x − 3)² + (y + 5)² = 81. What is its radius?", "choices": null, "answer": "9", "solution": "The squared radius is 81, so the radius is √81 = 9.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 56, "domain": "Algebra", "q": "The solution of the system 3x + 2y = 21 and x − y = 2 is (x, y). What is x + y?", "choices": ["9", "8", "6", "12"], "answer": "B", "solution": "Use x = y + 2. Then 3(y + 2) + 2y = 21, giving y = 3 and x = 5. Their sum is 8.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 57, "domain": "Advanced Math", "q": "What is the smaller solution of x² − 15x + 54 = 0?", "choices": null, "answer": "6", "solution": "Factor as (x − 6)(x − 9) = 0. The smaller root is 6.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 58, "domain": "Geometry and Trigonometry", "q": "In right triangle ABC, angle C is 90°, AC = 12, BC = 5, and AB = 13. What is sin A?", "choices": ["12/13", "5/12", "13/5", "5/13"], "answer": "D", "solution": "The side opposite A is BC and the hypotenuse is AB. Thus sin A = 5/13.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 59, "domain": "Problem-Solving and Data Analysis", "q": "A survey includes 36 seniors and 36 juniors. Of the seniors, 22 participated in a project and 14 did not. If one senior is chosen at random, what is the probability that the senior participated?", "choices": ["11/18", "11/36", "7/18", "1/2"], "answer": "A", "solution": "Only seniors belong in the denominator. The probability is 22/(22 + 14) = 11/18.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 60, "domain": "Algebra", "q": "For what value of k does the system kx + 4y = 16 and y = 3x − 6 have no solution?", "choices": null, "answer": "-12", "solution": "The first line has slope −k/4 and intercept 4. Match its slope to 3: k = -12. The intercepts 4 and −6 differ.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 61, "domain": "Advanced Math", "q": "For x ≠ 6, which expression equals (x² − 36)/(x − 6)?", "choices": ["x − 6", "x² + 6", "x + 6", "x² − 6"], "answer": "C", "solution": "The numerator factors as (x − 6)(x + 6). Cancel x − 6, retaining the restriction x ≠ 6.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 62, "domain": "Algebra", "q": "A tank initially contains 340 liters. After 5 minutes, 265 liters remain. Water drains at a constant rate. How many liters remain after 15 minutes?", "choices": ["116", "113", "119", "115"], "answer": "D", "solution": "The rate is (340 − 265)/5 = 15 liters per minute. The remaining amount is 340 − 15(15) = 115.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 63, "domain": "Advanced Math", "q": "The equation x² − 18x + k = 0 has exactly one real solution. What is k?", "choices": null, "answer": "81", "solution": "The discriminant must be zero: 324 − 4k = 0. Thus k = 81.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 64, "domain": "Advanced Math", "q": "A quadratic function f has zeros -4 and 6, and f(0) = -48. What is its minimum value?", "choices": ["-49", "-50", "-52", "-46"], "answer": "B", "solution": "f(x) = 2(x + 4)(x − 6). The vertex is at x = (-4 + 6)/2 = 1. Substitution gives the minimum -50.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 65, "domain": "Algebra", "q": "If 3(2x − 3) = 4x + 9, what is x?", "choices": ["10", "7", "9", "13"], "answer": "C", "solution": "Expand: 6x − 9 = 4x + 9. Hence 2x = 18 and x = 9.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 66, "domain": "Advanced Math", "q": "For x &gt; 0, which expression equals x<sup>5/2</sup>?", "choices": ["√(5x)", "x<sup>5</sup>/2", "x<sup>3</sup>√x", "x<sup>2</sup>√x"], "answer": "D", "solution": "Split the exponent into 2 + 1/2, giving x<sup>2</sup>√x.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 67, "domain": "Geometry and Trigonometry", "q": "A right circular cylinder has radius 5 centimeters and height 7 centimeters. What is its volume, in cubic centimeters?", "choices": ["175π", "35π", "70π", "245π"], "answer": "A", "solution": "V = πr²h = π(5²)(7) = 175π.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 68, "domain": "Problem-Solving and Data Analysis", "q": "A bag priced at $120 is discounted by 20%. A 5% sales tax is then applied to the discounted price. What is the final price, in dollars?", "choices": null, "answer": "100.8", "solution": "The final price is 120(1 − 20/100)(1 + 5/100) = $100.80.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 69, "domain": "Algebra", "q": "A line passes through (1, 6) and (4, 21). What is the y-coordinate of its y-intercept?", "choices": ["2", "-1", "1", "5"], "answer": "C", "solution": "The slope is (21 − 6)/(4 − 1) = 5. Since 6 = 5(1) + b, the intercept is b = 1.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 70, "domain": "Advanced Math", "q": "If g(x) = (x − 5)² − 14, what is the minimum value of g?", "choices": ["-13", "-16", "-10", "-14"], "answer": "D", "solution": "The squared term has minimum 0, achieved at x = 5. The minimum of g is therefore -14.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 71, "domain": "Algebra", "q": "Adult tickets cost $16 and student tickets cost $10. A group buys 29 tickets for $368. How many adult tickets does it buy?", "choices": ["13", "14", "11", "17"], "answer": "A", "solution": "Let a be adult tickets. The equation is 16a + 10(29 − a) = 368. Solving gives a = 13.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 72, "domain": "Geometry and Trigonometry", "q": "Two right triangles are similar. The smaller triangle has sides 5, 12, and 13. The larger triangle has hypotenuse 39. What is the area of the larger triangle?", "choices": null, "answer": "270", "solution": "The side scale factor is 3. The original area is 5(12)/2 = 30. Multiply by 3² to get 270.", "hint": "Identify what is being asked, write the relationship, and check your answer in the original problem.", "figure": null, "testSet": 2}, {"n": 73, "domain": "Advanced Math", "q": "The mo function figure(q){if(q.figure==='linear_table')return '<div class="qfigure"><table><tr><th>x</th><td>−1</td><td>1</td><td>3</td></tr><tr><th>f(x)</th><td>9</td><td>5</td><td>1</td></tr></table></div>';if(q.figure==='survey')return '<div class="qfigure"><table><tr><th>Grade</th><th>Yes</th><th>No</th></tr><tr><th>Junior</th><td>12</td><td>18</td></tr><tr><th>Senior</th><td>28</td><td>22</td></tr></table></div>';if(q.figure==='triangle')return '<div class="qfigure"><svg viewBox="0 0 350 170" width="320" role="img" aria-label="Right triangle ABC, right angle C; AC equals 12, BC equals 9, AB equals 15"><path d="M45 135H275V25Z" fill="none" stroke="#182437" stroke-width="2"/><path d="M262 135V122H275" fill="none" stroke="#182437"/><g font-size="15" fill="#182437"><text x="27" y="153">A</text><text x="283" y="153">C</text><text x="282" y="23">B</text><text x="151" y="155">12</text><text x="285" y="85">9</text><text x="143" y="67">15</text></g></svg></div>';return ''}
function bounds(s){return s.kind==='timed'?(s.module===1?[0,22]:[22,44]):[0,s.ids.length]}
function sessionPage(){const s=state.session;if(!s||s.status!=='active')return practice();const q=find(s.ids[s.index]),v=s.answers[q.n],checked=s.checked[q.n],isPractice=s.kind==='practice',[lo,hi]=bounds(s),count=hi-lo,local=s.index-lo,flagged=s.flags.includes(q.n),status=checked?(checked.correct?'correct':'incorrect'):'';return head(s.kind==='timed'?`Timed test / Module ${s.module}`:s.kind==='diagnostic'?'Starting diagnostic':'Focused practice',s.title,s.kind==='timed'?'Two fixed modules. The timer keeps running if you leave this page.':isPractice?'Think it through. Use a hint if you need one.':'Work independently. Review your results after submission.')+`${isPractice?practiceInstructions(false):''}<div class="question-layout"><article class="card"><div class="question-top"><span>Question <strong>${local+1} of ${count}</strong> <span class="muted">· Bank #${q.n}</span></span><button class="btn small ${flagged?'soft':'light'}" data-act="flag">${flagged?'★ Flagged':'☆ Flag question'}</button></div><p class="smalltext muted">${E(q.domain)}</p><div class="stem">${q.q}</div>${figure(q)}${q.choices?`<div class="choices" role="group" aria-label="Answer choices">${q.choices.map((c,i)=>{const l='ABCD'[i];return `<button class="choice ${v===l?'selected':''} ${checked&&l===q.answer?'correct':''} ${checked&&!checked.correct&&v===l?'incorrect':''}" data-choice="${l}" ${checked?'disabled':''} aria-pressed="${v===l}"><b>${l}</b><span>${c}</span></button>`}).join('')}</div>`:`<label class="field" for="spr">Your numerical answer<input id="spr" class="answer-input" inputmode="text" placeholder="Number or fraction" value="${E(v??'')}" ${checked?'disabled':''}></label><p class="smalltext muted">Enter one number or fraction; no units or percent sign. Negative answers are allowed.</p>`}${isPractice&&hintOpen?`<div class="hint"><strong>Try this first:</strong> ${q.hint}</div>`:''}${checked?`<div class="feedback ${checked.correct?'good':'bad'}" role="status"><strong>${checked.correct?'Correct. Keep that reasoning.':'A useful mistake to learn from.'}</strong><p><strong>Answer:</strong> ${answer(q)}</p><p>${q.solution}</p></div><label class="field" for="reason">What happened? (optional)<select id="reason"><option value="">Choose a reflection</option>${['Concept gap','Setup / translation','Calculation slip','Timing / rushed','I understood it'].map(t=>`<option ${state.reasons[q.n]===t?'selected':''}>${t}</option>`).join('')}</select></label>`:''}<div class="actions">${isPractice?calculatorLink():''}${isPractice&&!checked?btn('Check answer','check'):''}${isPractice&&!checked?btn('Show a hint','hint','light'):''}${isPractice&&GUIDES[q.n]?`<button class="btn light" data-guide="${q.n}">Desmos walkthrough</button>`:''}${s.index>lo?btn('← Previous','prev','light'):''}${s.index<hi-1?btn('Next question →','next','light'):btn(s.kind==='timed'&&s.module===1?'Submit module 1 →':'Finish session','submit')}</div><p class="status" id="answerStatus" role="status"></p></article><div class="session-side"><section class="card">${s.kind==='timed'?'<span class="eyebrow">TIME REMAINING</span><div class="timer" id="timer">35:00</div><p class="smalltext muted">35 minutes per module</p>':'<h3>Your question map</h3><p>Filled squares have answers. A dot marks a flagged question.</p>'}<div class="qnav">${s.ids.slice(lo,hi).map((id,i)=>`<button class="${i+lo===s.index?'current':''} ${has(find(id),s.answers[id])?'answered':''} ${s.flags.includes(id)?'flagged':''}" data-index="${i+lo}" aria-label="Question ${i+1}${s.flags.includes(id)?', flagged':''}">${i+1}</button>`).join('')}</div><p class="smalltext muted">${s.ids.slice(lo,hi).filter(id=>has(find(id),s.answers[id])).length} / ${count} answered</p>${btn(s.kind==='timed'&&s.module===1?'Submit module 1':'Submit session','submit','soft small')}<div class="actions">${btn('End session early','end','light small')}</div></section><section class="card"><h3>Your tools</h3><p>Use the calculator in a separate tab. Come back here to enter your answer.</p><a class="btn light small" href="https://www.desmos.com/calculator" target="_blank" rel="noopener noreferrer">Open Desmos ↗</a><details style="margin-top:16px"><summary class="smalltext">Quick formula reference</summary><p>Circle: A = πr²; C = 2πr<br>Triangle: A = ${fractionHTML('bh','2')}<br>Right triangle: a² + b² = c²<br>Cylinder: V = πr²h<br>sin θ = ${fractionHTML('opposite','hypotenuse')}<br>cos θ = ${fractionHTML('adjacent','hypotenuse')}</p></details></section></div></div>`}
function trackTime(){const s=state.session;if(!s)return;const id=s.ids[s.index];s.spent[id]=(s.spent[id]||0)+(Date.now()-s.qStart);s.qStart=Date.now()}
function changeQuestion(i){trackTime();state.session.index=i;state.session.qStart=Date.now();hintOpen=false;persist();render();window.scrollTo(0,0)}
function check(){const s=state.session,q=find(s.ids[s.index]),v=s.answers[q.n];if(!has(q,v)){$('answerStatus').textContent='Choose an answer or enter a number first.';return}if(!q.choices&&!Number.isFinite(numeric(v))){$('answerStatus').textContent='Enter a number such as −4, 64.8, or 3/5.';return}if(s.checked[q.n])return;trackTime();const ok=isCorrect(q,v);s.checked[q.n]={correct:ok};state.history.push({id:q.n,correct:ok,kind:'practice',date:Date.now(),hint:s.hints.includes(q.n),spent:s.spent[q.n]||0});persist();render()}
function submit(expired=false){const s=state.session;if(!s||s.status!=='active')return;trackTime();if(s.kind==='timed'&&s.module===1){s.module=2;s.index=22;s.deadline=expired?s.deadline+35*60*1000:Date.now()+35*60*1000;s.qStart=Date.now();notice=expired?'Time is up for module 1. Module 2 has started.':'Module 1 submitted. Module 2 has started; module 1 is now locked.';persist();render();return}finish()}
function finish(){const s=state.session;if(!s||s.status!=='active')return;trackTime();if(s.kind!=='practice'&&!s.recorded){for(const id of s.ids){const q=find(id);state.history.push({id,correct:isCorrect(q,s.answers[id]),kind:s.kind,date:Date.now(),hint:false,spent:s.spent[id]||0})}s.recorded=true}if(s.kind==='practice'){for(const id of s.ids){if(!s.checked[id]&&has(find(id),s.answers[id])){state.history.push({id,correct:isCorrect(find(id),s.answers[id]),kind:'practice',date:Date.now(),hint:s.hints.includes(id),spent:s.spent[id]||0})}}}s.status='complete';const details=s.ids.map(id=>({id,correct:isCorrect(find(id),s.answers[id]),answer:s.answers[id]??'',checked:!!s.checked[id]}));state.results.push({kind:s.kind,title:s.title,date:Date.now(),details,score:details.filter(r=>r.correct).length,total:s.ids.length});state.results=state.results.slice(-20);state.view='results';persist();render();window.scrollTo(0,0)}
function updateTimer(){const s=state.session;if(!s||s.kind!=='timed'||s.status!=='active')return;const left=Math.ceil((s.deadline-Date.now())/1000);if(left<=0){submit(true);return}if($('timer')){$('timer').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').classList.toggle('urgent',left<=300)}}
function resultsPage(){const r=state.results.at(-1);if(!r)return home();return head('Session complete','Make the next attempt stronger.','Review the reasoning, then try missed questions again without help.')+`<div class="grid3"><div class="stat"><small>Session result</small><strong>${r.score} / ${r.total}</strong><span>${r.kind==='practice'?'Includes unchecked / unanswered questions as not correct':'Unanswered questions count as incorrect'}</span></div><div class="stat"><small>Accuracy</small><strong>${Math.round(r.score/r.total*100)}%</strong><span>Raw practice accuracy; not an SAT score</span></div><div class="stat"><small>Review opportunities</small><strong>${r.total-r.score}</strong><span>Questions to revisit</span></div></div><div class="card"><h3>Your topic breakdown</h3>${D.map((d,i)=>{const rows=r.details.filter(t=>find(t.id).domain===d);return `<div class="domainrow"><div class="rowline"><strong>${short[i]}</strong><span>${rows.filter(t=>t.correct).length} / ${rows.length}</span></div><div class="bar"><i style="width:${rows.length?100*rows.filter(t=>t.correct).length/rows.length:0}%"></i></div></div>`}).join('')}<div class="actions">${btn('Review missed questions','review-home')}${btn('Back to overview','overview','light')}</div></div><div class="card" style="margin-top:20px"><h3>Answer review</h3>${r.details.map(t=>{const q=find(t.id);return `<details class="domainrow"><summary>Bank #${q.n} · ${t.correct?'✓ Correct':'Review'} · ${E(q.domain)}</summary><div class="stem">${q.q}</div>${figure(q)}<p><strong>Your answer:</strong> ${formatMath(E(t.answer||'Not answered'))}<br><strong>Correct answer:</strong> ${answer(q)}</p><p>${q.solution}</p></details>`}).join('')}</div>`}
const GUIDES={
1:{title:'Solve a linear equation',lines:'y = 5x - 7\ny = 18',steps:['Enter each equation on its own line.','Click the intersection. Its x-coordinate is the solution.','The point is (5, 18), so x = 5.'],why:'Equal y-values identify the x-value that makes the two sides equal.'},
7:{title:'Evaluate a function',lines:'f(x) = 2x^2 - 3\nf(-2)',steps:['Define the function using f(x).','Enter f(-2) on the next line.','Read the numerical output: 5.'],why:'Use parentheses around negative inputs before squaring.'},
11:{title:'Read a circle’s radius',lines:'(x-3)^2 + (y+2)^2 = 49\ny = -2',steps:['The center is (3, −2), so the horizontal line y = −2 passes through its center.','Click both intersections: (−4, −2) and (10, −2).','The diameter is 10 − (−4) = 14, so the radius is 7.'],why:'A line through the center gives a diameter. A general chord may be shorter.'},
12:{title:'Solve a system by intersections',lines:'2x + 3y = 19\nx - y = 2',steps:['Graph both equations.','Click the intersection to get (5, 3).','The question asks for x + y, so add 5 + 3 = 8.'],why:'Read the quantity asked for; the point itself may not be the final answer.'},
13:{title:'Find a quadratic’s roots',lines:'y = x^2 - 9x + 20',steps:['Graph the quadratic and click its x-intercepts.','The intercepts are (4, 0) and (5, 0).','Choose the smaller x-value: 4.'],why:'Solutions of a quadratic set equal to zero are its x-intercepts.'},
19:{title:'Find a repeated root',lines:'y = x^2 - 14x + k',steps:['Create the slider k when Desmos offers it.','Adjust k until the vertex lies on the x-axis; here that occurs at k = 49.','Confirm algebraically: the discriminant is 196 − 4k = 0, giving k = 49.'],why:'A slider gives a visual estimate. Use the discriminant to confirm an exact repeated-root condition.'},
20:{title:'Find the minimum of a parabola',lines:'y = 2(x+2)(x-6)',steps:['Use the zeros and f(0) to obtain the leading coefficient 2.','Enter the factored expression and click the vertex.','The vertex is (2, −32), so the minimum value is −32.'],why:'The minimum is the vertex’s y-coordinate, not its x-coordinate.'},
21:{title:'Solve with two lines',lines:'y = 3(2x-1)\ny = 4x + 11',steps:['Graph both sides as separate functions.','Click their intersection.','The x-coordinate is 7.'],why:'The intersection gives the input where both expressions agree.'},
25:{title:'Find the y-intercept',lines:'y - 7 = 3(x - 2)',steps:['First compute slope: (19 − 7)/(6 − 2) = 3.','Graph the line and click its y-intercept.','The intercept is (0, 1), so the requested y-coordinate is 1.'],why:'Point-slope form uses a known point and the slope.'},
26:{title:'Read a minimum value',lines:'y = (x-5)^2 - 9',steps:['Graph the function.','Click the vertex (5, −9).','The minimum value is −9.'],why:'Vertex form also reveals this directly: a positive square is smallest at zero.'},
32:{title:'Intersections of a line and parabola',lines:'y = x^2\ny = 2x + 3',steps:['Graph both equations.','Click the two intersections: (−1, 1) and (3, 9).','Add the y-coordinates: 1 + 9 = 10.'],why:'The problem asks for the sum of y-coordinates, so do not add the roots −1 and 3.'},
35:{title:'Check a radical equation',lines:'y = sqrt(3x+10)\ny = x',steps:['Graph the square root and the line.','Their intersection is (5, 5).','The solution is x = 5; the negative candidate from squaring does not appear.'],why:'Squaring can produce an extraneous solution. The original square root cannot be negative.'},
36:{title:'Circle radius from a diameter',lines:'x^2 + y^2 - 8x + 6y = 0\ny = -3',steps:['Complete the square: (x − 4)² + (y + 3)² = 25. The center is (4, −3).','Enter y = −3 because it passes through the center.','Click the two intersections: (−1, −3) and (9, −3).','The diameter is 9 − (−1) = 10. Divide by 2 to get radius 5.'],why:'Why y = −3? It is the center’s y-coordinate. Only a chord through the center is guaranteed to be a diameter.'},
37:{title:'Solve an identity using two inputs',lines:'y = -2x\nx = 12 + y',steps:['The original equation is a(3x − 2) = 12x + b, true for every x.','At original input x = 0: b = −2a. At original input x = 1: a = 12 + b.','For the two Desmos lines, use horizontal x to represent a and vertical y to represent b.','The intersection is (4, −8), so a + b = −4.'],why:'Because both sides of the original equation are linear, matching them at two distinct inputs forces the identity. The Desmos axes here represent a and b, not the original input x.'},
38:{title:'Solve a rational equation',lines:'y = 3/(x-2) + 2/(x+2)\ny = 1',steps:['Enter both equations on separate lines.','Click both intersections. Their x-coordinates are −1 and 6.','The question asks for their sum: −1 + 6 = 5.','Check that neither solution is an excluded value, x = 2 or x = −2.'],why:'The vertical asymptotes at ±2 are not solutions.'},
40:{title:'Use the relationship between roots',lines:'y = 4x^2\ny = 36',steps:['Call the two positive roots r and 4r. Their product is 36, giving 4r² = 36.','In these Desmos lines, x represents r. Choose the positive intersection x = 3.','The roots are 3 and 12. Since their sum is −k, calculate −(3 + 12).','The result is k = −15.'],why:'This method needs the roots’ product and sum rules first. The graph helps solve for the positive smaller root.'},
42:{title:'A tangent line and parabola',lines:'y = x^2 - 6x + c\ny = 2x + 1',steps:['Add a slider for c and look for one intersection.','Set the expressions equal: x² − 8x + c − 1 = 0.','Use a zero discriminant to confirm c = 17. At that value the curves meet at (4, 9).'],why:'Graphs and sliders are visual checks. For a guaranteed exact one-intersection answer, confirm the discriminant equals zero.'}

function desmos(){const g=GUIDES[guide]||GUIDES[36];return head('Desmos lab','A graph is a tool. Know what to read.','Practise the setup, then connect the graph to the answer.')+`<div class="tabs">${[36,37,38,40,19,32].map(id=>`<button class="btn small ${guide===id?'':'light'}" data-guide="${id}">Question ${id}</button>`).join('')}</div><div class="grid2"><section class="card"><span class="badge">BANK QUESTION ${guide}</span><h2>${g.title}</h2><p>Enter each expression on a separate line.</p><pre id="expressions">${E(g.lines)}</pre><div class="actions"><button class="btn" data-act="copy">Copy expressions</button><a class="btn light" href="https://www.desmos.com/calculator" target="_blank" rel="noopener noreferrer">Open Desmos ↗</a></div><p class="status" id="copyStatus" role="status"></p><div class="formula">${g.why}</div></section><section class="card"><h3>Follow the reasoning</h3><ol class="desmos-steps">${g.steps.map(t=>`<li>${t}</li>`).join('')}</ol><div class="actions"><button class="btn soft" data-single="${guide}">Try this question</button>${state.session?.status==='active'?btn('Resume your session','resume','light'):''}</div></section></div><p class="bottomnote">Calculator guidance follows standard Desmos graphing and intersection features. <a href="https://help.desmos.com/hc/en-us/articles/4406040715149-Getting-Started-Desmos-Graphing-Calculator" target="_blank" rel="noopener noreferrer">Official Desmos help ↗</a></p>`}
function startTimedSet(set){const offset=(set-1)*44,ids=[...Array.from({length:18},(_,i)=>i+1),41,19,20,42,...Array.from({length:18},(_,i)=>i+21),43,39,40,44].map(id=>id+offset);startSession('timed',ids,'Timed Test '+set)}
function timed(){const active=state.session?.status==='active';return head('Exam rehearsal','Choose your timed test.','Three separate sets · 44 questions per test · 70 minutes each')+`<div class="noticeline">Each test has two 22-question modules, with 35 minutes for each module. The three tests use different questions. All tests are fixed-form practice, not adaptive SAT assessments.</div>${active?`<div class="card" style="margin-bottom:20px"><h3>Session in progress</h3><p>${E(state.session.title)} is active. Resume or end it before starting another test.</p>${btn('Resume active session →','resume')}</div>`:''}<div class="grid3">${[1,2,3].map(set=>{const result=state.results.filter(r=>r.kind==='timed'&&r.title==='Timed Test '+set).at(-1);const first=(set-1)*44+1,last=set*44;return `<article class="card"><span class="badge">SET ${set}</span><h2 style="margin-top:18px">Timed Test ${set}</h2><p>44 questions<br>2 modules × 35 minutes<br>Bank questions ${first}–${last}</p><p>${result?`Last result: <strong>${result.score}/44</strong>`:'Not completed yet'}</p><button class="btn" data-test-set="${set}">Start Test ${set} →</button></article>`}).join('')}</div><div class="grid2"><section class="card"><h3>What to expect</h3><ul class="smalltext muted"><li>Calculator access throughout.</li><li>No hints or solutions until the full test is submitted.</li><li>Move between questions within the current module.</li><li>Module 1 locks after submission.</li><li>Answers save on this device; the timer continues if you leave the page.</li></ul>${calculatorLink()}</section><section class="card"><h3>Use each result to guide practice</h3><p>After submitting, review the answer explanations and topic breakdown. Revisit missed questions before attempting another set.</p><p>Practice modes share these questions, so familiar items can appear in a timed test. This app’s raw result does not convert to a 200–800 SAT score.</p><a href="https://satsuite.collegeboard.org/sat/practice-preparation/practice-tests" target="_blank" rel="noopener noreferrer">Official College Board practice resources ↗</a></section></div><p class="bottomnote">Timing reference: <a href="https://satsuite.collegeboard.org/sat/whats-on-the-test/structure" target="_blank" rel="noopener noreferrer">College Board SAT structure</a>. The original SAT uses adaptive modules and includes unscored pretest questions; all questions count in these practice tests.</p>`}

function reviewIds(){const map=latest(),missed=new Set();for(const r of state.results)for(const t of r.details)if(!t.correct&&!map[t.id]?.correct)missed.add(t.id);return BANK.map(q=>q.n).filter(id=>map[id]&&!map[id].correct||missed.has(id)||state.flags.includes(id))}
function review(){const map=latest(),ids=reviewIds();return head('Mistake review','Turn a missed question into a method.','Review your reasoning, name the error, and solve it again without help.')+`<section class="card"><div class="cardhead"><h3>${ids.length} questions in your review list</h3>${ids.length?btn('Practise review questions','reviewPractice','soft small'):''}</div>${ids.length?ids.map(id=>{const q=find(id);return `<div class="review-item"><div><strong>Question ${id} · ${E(q.domain)}</strong><p>${map[id]&&!map[id].correct?'Last attempt needs review':!map[id]?'Unanswered in a completed session':'Bookmarked for review'}${state.reasons[id]?' · '+E(state.reasons[id]):''}</p></div><div class="actions" style="margin-top:0"><button class="btn small" data-single="${id}">Try again</button><button class="btn light small" data-bookmark="${id}">${state.flags.includes(id)?'★ Saved':'☆ Save'}</button></div></div>`}).join(''):'<div class="empty">Your review list is clear. Missed questions and saved bookmarks will appear here.</div>'}</section><div class="card" style="margin-top:20px"><h3>A three-step review habit</h3><p>1. Describe the mistake: concept, setup, arithmetic, or timing.<br>2. Explain the correct method in your own words.<br>3. Try the question again without reading the explanation.</p><p>Questions leave the missed list after your latest attempt is correct. Bookmarks stay until you remove them.</p></div>`}
function progress(){const s=stats(),map=latest(),unassisted=state.history.filter(h=>!h.hint),hinted=state.history.filter(h=>h.hint);return head('Your progress','Measure the work. Notice the growth.','Use topic accuracy and your review list to plan the next session.',btn('Print progress report','print','light print-btn'))+`<div class="card"><div class="grid2"><label class="field" for="student">Student name (optional)<input id="student" value="${E(state.name)}" placeholder="Your first name"></label><label class="field" for="dailygoal">Daily question target<select id="dailygoal">${[5,8,10,15,20].map(n=>`<option ${state.goal===n?'selected':''}>${n}</option>`).join('')}</select></label></div><p class="smalltext">Progress is saved in this browser on this device. It is not automatically shared with Dr. Atandoh.</p></div><div class="grid3"><div class="stat"><small>Unique questions attempted</small><strong>${s.total}/${BANK.length}</strong><span>Latest answer per question</span></div><div class="stat"><small>Total submitted attempts</small><strong>${state.history.length}</strong><span>Includes repeated practice</span></div><div class="stat"><small>Hints used in practice</small><strong>${hinted.length}</strong><span>${unassisted.length} submitted attempts without hints</span></div></div><div class="card"><h3>Topic-by-topic</h3><div class="tablewrap"><table><tr><th>Topic</th><th>Explored</th><th>Latest correct</th><th>Latest accuracy</th></tr>${D.map((d,i)=>{const r=stats(d);return `<tr><td>${short[i]}</td><td>${r.total}/${BANK.filter(q=>q.domain===d).length}</td><td>${r.correct}</td><td>${r.rate===null?'—':r.rate+'%'}</td></tr>`}).join('')}</table></div><p>Latest-answer accuracy is based on your most recent submitted attempt at each question, including attempts made with hints. Repeated questions and prior solution review can improve this metric without measuring readiness for unseen questions.</p></div><div class="card" style="margin-top:20px"><h3>Recent sessions</h3>${state.results.length?state.results.slice(-8).reverse().map(r=>`<div class="domainrow"><div class="rowline"><strong>${E(r.title)}</strong><span>${r.score}/${r.total}</span></div><p>${new Date(r.date).toLocaleDateString()} · ${r.kind==='timed'?'Timed test':r.kind==='diagnostic'?'Diagnostic':'Practice'}</p></div>`).join(''):'<p>No completed sessions yet. Your first diagnostic is a useful starting point.</p>'}</div><p class="bottomnote">This app is an original practice tool, not an official College Board assessment or a predictor of a particular SAT score.</p>`}
function printProgress(){const s=stats();$('report').innerHTML=`<h1>SAT Math Coach · Progress report</h1><p><strong>Student:</strong> ${E(state.name||'Not entered')}<br><strong>Date:</strong> ${new Date().toLocaleDateString()}<br><strong>Explored:</strong> ${s.total}/${BANK.length} questions<br><strong>Latest-answer accuracy:</strong> ${s.rate===null?'Not available':s.rate+'%'}</p><table><tr><th>Topic</th><th>Tried</th><th>Latest correct</th><th>Accuracy</th></tr>${D.map((d,i)=>{const r=stats(d);return `<tr><td>${short[i]}</td><td>${r.total}</td><td>${r.correct}</td><td>${r.rate===null?'—':r.rate+'%'}</td></tr>`}).join('')}</table><h2>Questions to revisit</h2>${Object.values(latest()).filter(r=>!r.correct).map(r=>`<article><strong>Bank #${r.id} · ${E(find(r.id).domain)}</strong><p>${find(r.id).q}</p><p>Reflection: ${E(state.reasons[r.id]||'Not recorded')}</p></article>`).join('')||'<p>No missed questions in the latest-attempt record.</p>'}<p>Accuracy includes repeated questions and hinted attempts. This is not an SAT scaled score.</p>`;window.print()}
function bind(){document.querySelectorAll('[data-test-set]').forEach(b=>b.onclick=()=>startTimedSet(+b.dataset.testSet));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{topic=+b.dataset.lesson;state.view='learn';render();window.scrollTo(0,0)});document.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>startTopic(+b.dataset.domain));document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{guide=+b.dataset.guide;state.view='desmos';persist();render();window.scrollTo(0,0)});document.querySelectorAll('[data-domain-run]').forEach(b=>b.onclick=()=>startDomainSet(+b.dataset.domainRun,true));document.querySelectorAll('[data-domain-set]').forEach(b=>b.onclick=()=>startDomainSet(+b.dataset.domainSet,false));document.querySelectorAll('[data-single]').forEach(b=>b.onclick=()=>startSession('practice',[+b.dataset.single],'Question '+b.dataset.single+' practice'));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const s=state.session;if(s.checked[s.ids[s.index]])return;s.answers[s.ids[s.index]]=b.dataset.choice;persist();render()});document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>changeQuestion(+b.dataset.index));document.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=()=>{const id=+b.dataset.bookmark;state.flags=state.flags.includes(id)?state.flags.filter(n=>n!==id):[...state.flags,id];persist();render()});if($('spr'))$('spr').oninput=e=>{state.session.answers[state.session.ids[state.session.index]]=e.target.value;persist()};if($('reason'))$('reason').onchange=e=>{state.reasons[state.session.ids[state.session.index]]=e.target.value;persist()};if($('student'))$('student').oninput=e=>{state.name=e.target.value;persist()};if($('dailygoal'))$('dailygoal').onchange=e=>{state.goal=+e.target.value;persist()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act))}
function action(a){switch(a){case'overview':navigate('home');break;case'practice-home':navigate('practice');break;case'review-home':navigate('review');break;case'alltopics':topic=null;render();break;case'clearpractice':state.practiceDomain=null;persist();render();break;case'recommended':startTopic(D.indexOf(weak()));break;case'mixed':startSession('practice',pick(BANK.map(q=>q.n),8));break;case'diagnostic':startSession('diagnostic',[4,9,16,7,19,38,8,15,34,11,14,36],'12-question starting diagnostic');break;case'startTimed':startTimedSet(1);break;case'resume':state.view='session';notice='';persist();render();break;case'check':check();break;case'hint':{hintOpen=true;const s=state.session,id=s.ids[s.index];if(!s.hints.includes(id))s.hints.push(id);persist();render();break}case'prev':changeQuestion(state.session.index-1);break;case'next':changeQuestion(state.session.index+1);break;case'submit':submit();break;case'end':finish();break;case'flag':{const s=state.session,id=s.ids[s.index];s.flags=s.flags.includes(id)?s.flags.filter(n=>n!==id):[...s.flags,id];state.flags=state.flags.includes(id)?state.flags.filter(n=>n!==id):[...state.flags,id];persist();render();break}case'reviewPractice':{const map=latest();startSession('practice',reviewIds(),'Review practice');break}case'copy':{const text=(GUIDES[guide]||GUIDES[36]).lines;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{$('copyStatus').textContent='Copied. Paste each expression on a separate line in Desmos.'}).catch(()=>{$('copyStatus').textContent='Copy is unavailable here. Select and copy the expressions above.'});else $('copyStatus').textContent='Select and copy the expressions above.';break}case'print':printProgress();break}}
prepareMathDisplay();
render();
</script></body></html>
